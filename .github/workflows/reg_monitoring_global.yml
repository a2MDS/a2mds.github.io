name: Regulatory Monitoring (Global)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor-and-report:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 1. 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: 2. 파이썬 3.11 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. 필수 패키지 및 Playwright 브라우저 설치
        run: |
          pip install --no-cache-dir beautifulsoup4 gspread google-auth requests playwright urllib3
          playwright install --with-deps chromium

      - name: 4. 스크립트 특수 공백 자동 치환
        run: |
          python3 -c "
          with open('reg_monitoring_global.py', 'rb') as f:
              content = f.read()
          content = content.replace(b'\xc2\xa0', b' ').replace(b'\t', b'    ')
          with open('reg_monitoring_global.py', 'wb') as f:
              f.write(content)
          print('✅ reg_monitoring_global.py 특수 공백 정제 완료')
          "

      - name: 5. 글로벌 규제 모니터링 및 시트/이메일 동기화 실행
        env:
          PYTHONUNBUFFERED: "1"
          REG_SA_KEY: ${{ secrets.REG_SA_KEY }}
          SA_KEY: ${{ secrets.REG_SA_KEY }}
          ALERT_EMAIL_SENDER: ${{ secrets.ALERT_EMAIL_SENDER }}
          ALERT_EMAIL_PASSWORD: ${{ secrets.ALERT_EMAIL_PASSWORD }}
          ALERT_EMAIL_RECEIVER: ${{ secrets.ALERT_EMAIL_RECEIVER }}
        run: |
          python reg_monitoring_global.py
