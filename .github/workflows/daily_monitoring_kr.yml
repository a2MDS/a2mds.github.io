name: Daily Regulatory Monitoring (Korea)

on:
  workflow_dispatch:

jobs:
  run-korea-monitor:
    runs-on: self-hosted

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Korea Regulatory Monitor Script
        env:
          REG_SA_KEY: ${{ secrets.REG_SA_KEY }}
          ALERT_EMAIL_SENDER: ${{ secrets.ALERT_EMAIL_SENDER }}
          ALERT_EMAIL_PASSWORD: ${{ secrets.ALERT_EMAIL_PASSWORD }}
          ALERT_EMAIL_RECEIVER: ${{ secrets.ALERT_EMAIL_RECEIVER }}
          LAW_OC_KEY: ${{ secrets.LAW_OC_KEY }}
        run: |
          & "C:\Users\samsung\AppData\Local\Python\pythoncore-3.14-64\python.exe" reg_monitoring_kr.py
