name: Daily Regulatory Monitoring (Korea)

on:
  workflow_dispatch:

jobs:
  run-korea-monitor:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        shell: cmd
        run: |
          "C:\Users\samsung\AppData\Local\Python\pythoncore-3.14-64\python.exe" -m pip install --upgrade pip
          "C:\Users\samsung\AppData\Local\Python\pythoncore-3.14-64\python.exe" -m pip install requests beautifulsoup4 playwright gspread google-auth
          "C:\Users\samsung\AppData\Local\Python\pythoncore-3.14-64\python.exe" -m playwright install chromium

      - name: Run Korea Regulatory Monitor Script
        shell: cmd
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          REG_SA_KEY: ${{ secrets.REG_SA_KEY }}
          ALERT_EMAIL_SENDER: ${{ secrets.ALERT_EMAIL_SENDER }}
          ALERT_EMAIL_PASSWORD: ${{ secrets.ALERT_EMAIL_PASSWORD }}
          ALERT_EMAIL_RECEIVER: ${{ secrets.ALERT_EMAIL_RECEIVER }}
          LAW_OC_KEY: ${{ secrets.LAW_OC_KEY }}
        run: |
          "C:\Users\samsung\AppData\Local\Python\pythoncore-3.14-64\python.exe" reg_monitoring_kr.py
