name: Daily Regulatory Monitoring (Korea)

on:
  workflow_dispatch: # 웹에서 'Run workflow' 버튼으로 수동 실행

jobs:
  run-korea-monitor:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        shell: cmd
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 playwright gspread google-auth
          playwright install chromium

      - name: Run Korea Regulatory Monitor Script
        shell: cmd
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          REG_SA_KEY: ${{ secrets.REG_SA_KEY }}
          ALERT_EMAIL_SENDER: ${{ secrets.ALERT_EMAIL_SENDER }}
          ALERT_EMAIL_PASSWORD: ${{ secrets.ALERT_EMAIL_PASSWORD }}
          ALERT_EMAIL_RECEIVER: ${{ secrets.ALERT_EMAIL_RECEIVER }}
          LAW_OC_KEY: ${{ secrets.LAW_OC_KEY }}
        run: |
          python reg_monitoring_kr.py
