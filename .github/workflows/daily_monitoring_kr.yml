name: Daily Regulatory Monitoring (Korea)

on:
  workflow_dispatch:

jobs:
  run-korea-monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 gspread google-auth playwright
          playwright install --with-deps chromium

      - name: Run Korea Regulatory Monitor Script
        env:
          REG_SA_KEY: ${{ secrets.REG_SA_KEY }}
          ALERT_EMAIL_SENDER: ${{ secrets.ALERT_EMAIL_SENDER }}
          ALERT_EMAIL_PASSWORD: ${{ secrets.ALERT_EMAIL_PASSWORD }}
          ALERT_EMAIL_RECEIVER: ${{ secrets.ALERT_EMAIL_RECEIVER }}
          LAW_OC_KEY: ${{ secrets.LAW_OC_KEY }}
        run: |
          python reg_monitoring_kr.py
