name: RMI Smelter List Harvester

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harvest-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 1. 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: 2. 파이썬 3.11 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. 필수 패키지 및 Playwright 브라우저 설치
        run: |
          pip install --no-cache-dir openpyxl playwright google-api-python-client google-auth gspread requests python-dotenv
          playwright install --with-deps chromium

      - name: 4. 스크립트 특수 공백 자동 치환
        run: |
          python3 -c "
          with open('rmi_smelter.py', 'rb') as f:
              content = f.read()
          content = content.replace(b'\xc2\xa0', b' ').replace(b'\t', b'    ')
          with open('rmi_smelter.py', 'wb') as f:
              f.write(content)
          print('✅ rmi_smelter.py 특수 공백 정제 완료')
          "

      - name: 5. RMI 수집 및 Google Drive / Sheets 동기화 실행
        env:
          PYTHONUNBUFFERED: "1"
          TARGET_SPREADSHEET_ID: "1u_fOmUwj1AdAif6sBVcWgMuR3vAcxGb6Bz1tY0Bz45Q"
          GDRIVE_SA_KEY: ${{ secrets.GDRIVE_SA_KEY }}
          REG_SA_KEY: ${{ secrets.REG_SA_KEY }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          ALERT_EMAIL_SENDER: ${{ secrets.ALERT_EMAIL_SENDER }}
          ALERT_EMAIL_PASSWORD: ${{ secrets.ALERT_EMAIL_PASSWORD }}
          ALERT_EMAIL_RECEIVER: ${{ secrets.ALERT_EMAIL_RECEIVER }}
        run: |
          python rmi_smelter.py
