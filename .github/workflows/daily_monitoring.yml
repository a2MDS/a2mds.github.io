name: Daily Regulatory Monitoring Bot

on:
  schedule:
    # 매일 한국 시간 05:18 (UTC 기준 20:18) 자동 실행
    - cron: '18 20 * * *'
  workflow_dispatch: # Actions 탭에서 수동 실행 버튼 활성화

jobs:
  run-monitoring:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 gspread google-auth playwright
          playwright install --with-deps chromium

      - name: Run Monitoring Script
        env:
          REG_SA_KEY: ${{ secrets.REG_SA_KEY }}
        run: |
          python reg_monitoring.py
