name: Daily Regulatory Monitoring Bot

on:
  schedule:
    # 매일 한국 시간 08:30 (UTC 기준 전날 23:30) 자동 실행
    - cron: '30 23 * * *'
  workflow_dispatch: # GitHub 웹 화면에서 'Run workflow' 버튼으로 즉시 수동 실행 가능

jobs:
  run-monitoring:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 gspread google-auth playwright
          playwright install --with-deps chromium

      - name: Run Monitoring Script
        env:
          REG_SA_KEY: ${{ secrets.REG_SA_KEY }}
        run: |
          python reg_monitoring.py
