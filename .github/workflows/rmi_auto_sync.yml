name: RMI Smelter List Daily Harvester

on:
  schedule:
    - cron: '23 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harvest-and-save:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 1. 저장소 체크아웃 (항상 최신 main 강제 동기화)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: 2. 파이썬 3.11 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. 필수 패키지 및 Playwright 브라우저 설치
        run: |
          pip install --no-cache-dir openpyxl playwright google-api-python-client google-auth google-auth-oauthlib requests
          playwright install --with-deps chromium

      - name: 4. 스크립트 특수 공백 완전 자동 치환
        run: |
          python3 -c "
          with open('rmi_smelter.py', 'rb') as f:
              content = f.read()
          content = content.replace(b'\xc2\xa0', b' ').replace(b'\t', b'    ')
          with open('rmi_smelter.py', 'wb') as f:
              f.write(content)
          print('✅ rmi_smelter.py 특수 공백 치환 완료')
          "

      - name: 5. RMI 수집, 엑셀 통합 및 구글 드라이브 / 스프레드시트 동기화 실행
        env:
          PYTHONUNBUFFERED: "1"
          GAS_WEBAPP_URL: ${{ secrets.GAS_WEBAPP_URL }}
          GAS_AUTH_KEY: ${{ secrets.GAS_AUTH_KEY }}
          GDRIVE_SA_KEY: ${{ secrets.GDRIVE_SA_KEY }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          SMELTER_PULSE_SHEET_ID: ${{ secrets.SMELTER_PULSE_SHEET_ID }}
          ALERT_EMAIL_SENDER: ${{ secrets.ALERT_EMAIL_SENDER }}
          ALERT_EMAIL_PASSWORD: ${{ secrets.ALERT_EMAIL_PASSWORD }}
          ALERT_EMAIL_RECEIVER: ${{ secrets.ALERT_EMAIL_RECEIVER }}
        run: |
          python rmi_smelter.py
