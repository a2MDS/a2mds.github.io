name: RMI Smelter List Daily Harvester

on:
  schedule:
    # KST 오전 05:23 실행 (UTC 20:23)
    - cron: '23 20 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harvest-and-save:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 저장소 체크아웃 (항상 최신 main 강제 동기화)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: 2. 파이썬 3.11 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. 필수 패키지 및 Playwright 브라우저 설치
        run: |
          pip install --no-cache-dir openpyxl playwright google-api-python-client google-auth google-auth-oauthlib requests
          playwright install --with-deps chromium

      - name: 4. RMI 수집, 엑셀 통합 및 구글 드라이브 / 스프레드시트 동기화 실행
        env:
          GAS_WEBAPP_URL: ${{ secrets.GAS_WEBAPP_URL }}
          GAS_AUTH_KEY: ${{ secrets.GAS_AUTH_KEY }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          SMELTER_PULSE_SHEET_ID: ${{ secrets.SMELTER_PULSE_SHEET_ID }}
          ALERT_EMAIL_SENDER: ${{ secrets.ALERT_EMAIL_SENDER }}
          ALERT_EMAIL_PASSWORD: ${{ secrets.ALERT_EMAIL_PASSWORD }}
          ALERT_EMAIL_RECEIVER: ${{ secrets.ALERT_EMAIL_RECEIVER }}
        run: |
          python rmi_smelter.py
