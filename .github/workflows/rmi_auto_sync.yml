name: RMI Smelter List Daily Harvester

on:
  schedule:
    - cron: '23 20 * * *'
    - cron: '47 20 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harvest-and-save:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 1. 저장소 체크아웃 (항상 최신 main 강제 동기화)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: 2. 파이썬 3.11 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. 필수 패키지 및 Playwright 브라우저 설치
        run: |
          pip install --no-cache-dir openpyxl playwright google-api-python-client google-auth google-auth-oauthlib requests autopep8
          playwright install --with-deps chromium

      - name: 4. 스크립트 유니코드 공백 제거 및 들여쓰기 자동 교정
        run: |
          python -c "
          import unicodedata, pathlib
          p = pathlib.Path('rmi_smelter.py')
          if p.exists():
              text = p.read_text(encoding='utf-8')
              text = unicodedata.normalize('NFKC', text)
              text = text.replace('\u00a0', ' ').replace('\ufeff', '')
              p.write_text(text, encoding='utf-8')
          "
          autopep8 --in-place --aggressive --aggressive rmi_smelter.py

      - name: 5. RMI 수집, 엑셀 통합 및 구글 드라이브 / 스프레드시트 동기화 실행
        env:
          PYTHONUNBUFFERED: "1"
          GAS_WEBAPP_URL: ${{ secrets.GAS_WEBAPP_URL }}
          GAS_AUTH_KEY: ${{ secrets.GAS_AUTH_KEY }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          SMELTER_PULSE_SHEET_ID: ${{ secrets.SMELTER_PULSE_SHEET_ID }}
          ALERT_EMAIL_SENDER: ${{ secrets.ALERT_EMAIL_SENDER }}
          ALERT_EMAIL_PASSWORD: ${{ secrets.ALERT_EMAIL_PASSWORD }}
          ALERT_EMAIL_RECEIVER: ${{ secrets.ALERT_EMAIL_RECEIVER }}
        run: |
          python rmi_smelter.py
