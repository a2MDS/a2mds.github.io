name: RMI Smelter List Daily Harvester

on:
  schedule:
    # 한국 시간(KST) 매일 새벽 05:00 자동 실행 (UTC 기준 20:00)
    - cron: '0 20 * * *'
  workflow_dispatch: # 수동 즉시 실행 버튼

jobs:
  harvest-and-save:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 2. 파이썬 3.11 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 3. 필수 패키지 및 Playwright 브라우저 설치
        run: |
          pip install openpyxl playwright
          playwright install --with-deps chromium

      - name: 4. RMI 크롤링 및 엑셀 통합 실행
        run: |
          python main.py

      - name: 5. 결과 엑셀 파일 저장소에 자동 커밋 & 푸시
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          mkdir -p exports
          mv RMI_Consolidated_Smelter_List_*.xlsx exports/ 2>/dev/null || true
          
          git add exports/
          if git diff --staged --quiet; then
            echo "변경 사항 없음"
          else
            git commit -m "Auto: Daily RMI Smelter Master Workbook $(date +'%Y-%m-%d')"
            git push
          fi

      - name: 6. 실행 결과물 90일 보관
        uses: actions/upload-artifact@v4
        with:
          name: RMI-Master-Workbooks
          path: exports/*.xlsx
          retention-days: 90
