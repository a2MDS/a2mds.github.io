name: RMI Smelter List Daily Harvester

on:
  schedule:
    # 한국 시간(KST) 매일 새벽 05:00 실행 (UTC 기준 20:00)
    - cron: '0 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harvest-and-save:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 2. 파이썬 3.11 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. 필수 패키지 및 Playwright 브라우저 설치
        run: |
          pip install openpyxl playwright google-api-python-client google-auth
          playwright install --with-deps chromium

      - name: 4. RMI 수집, 엑셀 통합 및 구글 드라이브 업로드 실행
        env:
          GDRIVE_SA_KEY: ${{ secrets.GDRIVE_SA_KEY }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          python rmi_smelter.py

      - name: 5. exports 폴더 GitHub 저장소 동기화 푸시
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add exports/
          if git diff --staged --quiet; then
            echo "변경 사항 없음"
          else
            git commit -m "Auto: Update RMI Smelter Files $(date +'%Y-%m-%d')"
            git push
          fi
