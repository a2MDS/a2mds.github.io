name: RMI Smelter List Auto Harvester

on:
  schedule:
    # 매월 1일 한국 시간(KST) 오전 9시 (UTC 00:00) 자동 실행
    - cron: '0 0 1 * *'
  workflow_dispatch: # 언제든 수동으로 'Run workflow' 버튼을 눌러 즉시 실행 가능

jobs:
  harvest-and-save:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 저장소 코드 가져오기
        uses: actions/checkout@v4

      - name: 2. 파이썬 3.11 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 3. 필수 라이브러리 및 Playwright 브라우저 설치
        run: |
          pip install openpyxl playwright
          playwright install --with-deps chromium

      - name: 4. RMI 수집 및 엑셀 통합 스크립트 실행
        run: |
          python main.py

      - name: 5. 생성된 엑셀 파일 GitHub 저장소에 자동 커밋 & 푸시
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # output 폴더 생성 후 엑셀 이동 (원할 경우)
          mkdir -p exports
          mv RMI_Consolidated_Smelter_List_*.xlsx exports/ 2>/dev/null || true
          
          git add exports/
          if git diff --staged --quiet; then
            echo "새로 변경된 파일이 없습니다."
          else
            git commit -m "Auto: RMI Smelter Consolidated Master Workbook $(date +'%Y-%m-%d')"
            git push
          fi

      - name: 6. 실행 결과물(Artifacts) 90일 보관 업로드
        uses: actions/upload-artifact@v4
        with:
          name: RMI-Master-Workbooks
          path: exports/*.xlsx
          retention-days: 90
