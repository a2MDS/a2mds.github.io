<!DOCTYPE html>
<html lang="ko">
<head>
  <meta name="robots" content="noindex, nofollow">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>a2MDS | Live Feedback</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
    :root {
      --brand: #16a34a;
      --brand-dark: #15803d;
      --brand-soft: #ecfdf3;
      --brand-border: #bbf7d0;
      --brand-track: #dcfce7;
      --slate: #0f172a;
      --slate-sub: #334155;
      --slate-body: #475569;
      --bg: #f8fafc;
      --card: #ffffff;
      --muted: #64748b;
      --border: #e2e8f0;
      --track: #eef2f6;
      --bar-muted: #cbd5e1;
      --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.04);
      --shadow-md: 0 6px 18px rgba(15, 23, 42, 0.06);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--slate);
      line-height: 1.5;
      padding: 24px 24px 64px;
    }

    .container { max-width: 1180px; margin: 0 auto; }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .header-left {
      flex: 1;
      min-width: 280px;
    }
    .brand-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 700;
      color: var(--brand-dark);
      background: var(--brand-soft);
      border: 1px solid var(--brand-border);
      padding: 3px 10px;
      border-radius: 6px;
      margin-bottom: 10px;
      letter-spacing: 0.01em;
    }
    .session-title {
      font-size: 25px;
      font-weight: 800;
      color: var(--slate);
      letter-spacing: -0.025em;
      line-height: 1.3;
      word-break: keep-all;
    }

    /* Integrated Live Status + Response Count + QR Panel */
    .header-right {
      display: flex;
      align-items: center;
      gap: 18px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 18px;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: border-color 0.15s, box-shadow 0.15s, transform 0.15s;
    }
    .header-right:hover {
      border-color: var(--brand);
      box-shadow: var(--shadow-md);
      transform: translateY(-1px);
    }
    .live-status-box {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 4px;
      padding-right: 18px;
      border-right: 1px solid var(--border);
    }
    .live-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11.5px;
      font-weight: 800;
      letter-spacing: 0.04em;
      color: var(--brand-dark);
      background: var(--brand-soft);
      border: 1px solid var(--brand-border);
      padding: 2px 8px;
      border-radius: 999px;
    }
    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--brand);
      flex-shrink: 0;
      animation: livePulse 2s infinite;
    }
    @keyframes livePulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(0.85); }
    }
    .response-stat {
      display: flex;
      align-items: baseline;
      gap: 7px;
      margin-top: 2px;
    }
    .response-label {
      font-size: 13.5px;
      font-weight: 700;
      color: var(--slate-sub);
    }
    .response-value {
      font-size: 24px;
      font-weight: 800;
      color: var(--brand);
      line-height: 1.1;
      letter-spacing: -0.02em;
    }

    .qr-section {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .qr-img {
      width: 64px;
      height: 64px;
      border-radius: 6px;
      display: block;
      background: #fff;
      border: 1px solid var(--border);
      flex-shrink: 0;
    }
    .qr-info {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .qr-info strong {
      font-size: 14px;
      font-weight: 700;
      color: var(--slate);
    }
    .qr-zoom-hint {
      font-size: 12px;
      font-weight: 600;
      color: var(--brand-dark);
    }

    @media (max-width: 640px) {
      .session-title { font-size: 21px; }
      .header-right { width: 100%; justify-content: space-between; }
    }

    /* Toolbar & Segmented Tabs */
    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .session-tabs {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #edf2f7;
      padding: 5px;
      border-radius: 12px;
      flex-wrap: wrap;
    }
    .tab-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--slate-body);
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .tab-btn:hover {
      color: var(--slate);
      background: rgba(255, 255, 255, 0.65);
    }
    .tab-btn.active {
      background: var(--slate);
      color: #ffffff;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.16);
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--slate-sub);
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      padding: 9px 15px;
      border-radius: 9px;
      cursor: pointer;
      text-decoration: none;
      box-shadow: var(--shadow-sm);
      transition: all 0.15s ease;
      min-width: 116px;
    }
    .btn:hover:not(:disabled) {
      border-color: var(--slate);
      color: var(--slate);
    }
    .btn:disabled {
      opacity: 0.7;
      cursor: wait;
    }
    .btn.btn-success {
      background: var(--brand-soft);
      border-color: var(--brand-border);
      color: var(--brand-dark);
    }
    .btn.btn-error {
      background: #fef2f2;
      border-color: #fecaca;
      color: #b91c1c;
    }
    .btn.btn-primary {
      background: var(--brand);
      border-color: var(--brand);
      color: #ffffff;
    }
    .btn.btn-primary:hover {
      background: var(--brand-dark);
      border-color: var(--brand-dark);
      color: #ffffff;
    }

    /* Error Banner */
    .error-banner {
      display: none;
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #b91c1c;
      font-size: 13.5px;
      font-weight: 600;
      padding: 12px 16px;
      border-radius: 10px;
      margin-bottom: 18px;
    }
    .error-banner.show { display: block; }

    /* 1-Question-Per-Row (2-Column Split: Question Left / Results Right) */
    .q-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .q-card {
      display: grid;
      grid-template-columns: 350px 1fr;
      gap: 24px;
      align-items: stretch;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px 22px;
      box-shadow: var(--shadow-sm);
      transition: box-shadow 0.15s ease, border-color 0.15s ease;
    }
    .q-card:hover {
      border-color: #cbd5e1;
      box-shadow: var(--shadow-md);
    }
    .q-left {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 14px;
      padding-right: 24px;
      border-right: 1px solid #f1f5f9;
    }
    .q-left-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    .q-num {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 11.5px;
      font-weight: 800;
      color: var(--brand-dark);
      background: var(--brand-soft);
      border: 1px solid var(--brand-border);
      padding: 2px 9px;
      border-radius: 999px;
    }
    .q-meta {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--muted);
      white-space: nowrap;
    }
    .q-title {
      font-size: 15.5px;
      font-weight: 700;
      color: var(--slate);
      line-height: 1.5;
      word-break: keep-all;
    }

    /* 5-Point Scale Average KPI in Left Column */
    .scale-kpi {
      display: inline-flex;
      align-items: baseline;
      gap: 8px;
      background: var(--brand-soft);
      border: 1px solid var(--brand-border);
      border-radius: 10px;
      padding: 8px 14px;
      align-self: flex-start;
    }
    .scale-kpi-label {
      font-size: 12.5px;
      font-weight: 700;
      color: var(--brand-dark);
    }
    .scale-kpi-val {
      font-size: 24px;
      font-weight: 800;
      color: var(--brand);
      line-height: 1.1;
      letter-spacing: -0.02em;
    }
    .scale-kpi-max {
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
    }

    /* Multi-Select Summary Note in Left Column */
    .multi-note {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 8px 12px;
      font-size: 12.5px;
      color: var(--slate-sub);
      line-height: 1.45;
    }
    .multi-note strong {
      color: var(--slate);
      font-weight: 700;
    }
    .multi-note-sub {
      display: block;
      font-size: 11.5px;
      color: var(--muted);
      margin-top: 2px;
    }

    .q-right {
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-width: 0;
    }

    @media (max-width: 820px) {
      .q-card {
        grid-template-columns: 1fr;
        gap: 14px;
      }
      .q-left {
        padding-right: 0;
        padding-bottom: 12px;
        border-right: none;
        border-bottom: 1px solid #f1f5f9;
      }
    }

    /* Horizontal Progress Bars */
    .bar-list {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .bar-item {
      padding: 6px 11px;
      border-radius: 9px;
      border: 1px solid transparent;
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }
    .bar-meta {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 5px;
    }
    .bar-label {
      font-size: 13.5px;
      color: var(--slate-body);
      font-weight: 500;
      word-break: keep-all;
    }
    .bar-count {
      flex-shrink: 0;
      display: inline-flex;
      align-items: baseline;
      gap: 5px;
    }
    .bar-num {
      font-size: 12.5px;
      font-weight: 500;
      color: var(--muted);
    }
    .bar-pct {
      font-size: 13.5px;
      font-weight: 700;
      color: var(--slate-sub);
    }
    .bar-share {
      font-size: 12px;
      font-weight: 500;
      color: var(--muted);
    }
    .bar-track {
      width: 100%;
      height: 6px;
      background: var(--track);
      border-radius: 999px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      background: var(--bar-muted);
      border-radius: 999px;
      transition: width 0.35s ease, background-color 0.25s ease;
    }

    /* Top Response Highlight */
    .bar-item.is-top {
      background: var(--brand-soft);
      border-color: var(--brand-border);
    }
    .bar-item.is-top .bar-label {
      font-size: 14px;
      color: var(--slate);
      font-weight: 700;
    }
    .bar-item.is-top .bar-num {
      font-size: 13px;
      font-weight: 600;
      color: var(--brand-dark);
    }
    .bar-item.is-top .bar-pct {
      font-size: 16.5px;
      font-weight: 800;
      color: var(--brand);
      letter-spacing: -0.02em;
    }
    .bar-item.is-top .bar-share {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--brand-dark);
    }
    .bar-item.is-top .bar-track {
      background: var(--brand-track);
    }
    .bar-item.is-top .bar-fill {
      background: var(--brand);
    }

    /* 5-Point Scale Compact Score Distribution Footer */
    .scale-summary {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px 10px;
      margin-top: 10px;
      padding: 8px 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 13px;
      color: var(--slate-body);
    }
    .scale-chip {
      display: inline-flex;
      align-items: baseline;
      gap: 4px;
    }
    .scale-chip strong {
      font-weight: 700;
      color: var(--slate);
    }
    .scale-chip.is-top {
      color: var(--brand-dark);
      font-weight: 700;
    }
    .scale-chip.is-top strong {
      color: var(--brand);
      font-weight: 800;
    }
    .scale-sep {
      color: #cbd5e1;
      user-select: none;
    }

    .empty-note {
      font-size: 13px;
      color: var(--muted);
      padding: 8px 4px;
    }

    /* QR Zoom Modal */
    .qr-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.65);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .qr-modal.open { display: flex; }
    .qr-modal-card {
      background: #ffffff;
      border-radius: 20px;
      padding: 32px;
      text-align: center;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.22);
    }
    .qr-modal-title {
      font-size: 18px;
      font-weight: 800;
      color: var(--slate);
      margin-bottom: 6px;
      word-break: keep-all;
    }
    .qr-modal-sub {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 20px;
    }
    .qr-modal-img {
      width: 280px;
      height: 280px;
      margin: 0 auto 22px;
      display: block;
      border: 1px solid var(--border);
      border-radius: 12px;
    }
    .qr-modal-actions {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    /* Footer */
    .footer {
      margin-top: 44px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      font-size: 13px;
      color: var(--muted);
      flex-wrap: wrap;
      gap: 12px;
    }
    .footer-links {
      display: inline-flex;
      align-items: center;
      gap: 18px;
      flex-wrap: wrap;
    }
    .footer a {
      color: var(--slate-sub);
      text-decoration: none;
      font-weight: 600;
    }
    .footer a:hover { color: var(--brand); }
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="header-left">
        <span class="brand-tag">a2MDS Consulting · Live Feedback</span>
        <h1 class="session-title" id="sessionTitle">IMDS 실무 현황 및 교육 기대사항 설문 (1회차)</h1>
      </div>
      <div class="header-right" onclick="openQrModal()" title="클릭하면 QR 코드를 크게 확대합니다">
        <div class="live-status-box">
          <div class="live-pill">
            <span class="live-dot"></span>
            <span>LIVE</span>
          </div>
          <div class="response-stat">
            <span class="response-label">총 응답</span>
            <strong class="response-value" id="totalParticipants">0명</strong>
          </div>
        </div>
        <div class="qr-section">
          <img class="qr-img" id="qrImage" src="./imds_survey_1st.png" alt="Survey QR Code" />
          <div class="qr-info">
            <strong>실시간 설문 참여</strong>
            <div class="qr-zoom-hint">클릭하여 확대 · 링크 ↗</div>
          </div>
        </div>
      </div>
    </header>

    <div class="toolbar">
      <div class="session-tabs" id="sessionTabs"></div>
      <button class="btn" id="refreshBtn" onclick="manualRefresh()">지금 새로고침</button>
    </div>

    <div class="error-banner" id="errorBanner"></div>
    <section class="q-list" id="qGrid"></section>

    <footer class="footer">
      <span><strong>a2MDS Consulting</strong><br>IMDS | Responsible Minerals | Product Environment Compliance</span>
      <div class="footer-links">
        <a href="https://docs.google.com/forms/u/0/" target="_blank" rel="noopener">Forms ↗</a>
        <a href="https://docs.google.com/spreadsheets/d/1AwmhwA6PCOcQenQOxxktD0TbrqHBY7Glw1E8zUEOxJk/edit" target="_blank" rel="noopener">Sheet ↗</a>
      </div>
    </footer>
  </div>

  <!-- QR Zoom Modal -->
  <div class="qr-modal" id="qrModal" onclick="closeQrModal()">
    <div class="qr-modal-card" onclick="event.stopPropagation()">
      <div class="qr-modal-title" id="modalQrTitle">IMDS 1회차 설문 참여 QR 코드</div>
      <div class="qr-modal-sub">스마트폰 카메라로 스캔하거나 아래 링크로 참여해 주세요</div>
      <img class="qr-modal-img" id="modalQrImage" src="./imds_survey_1st.png" alt="Enlarged QR Code" />
      <div class="qr-modal-actions">
        <a class="btn btn-primary" id="modalFormLink" href="#" target="_blank" rel="noopener noreferrer">설문 링크 열기 ↗</a>
        <button class="btn" onclick="closeQrModal()">닫기 (ESC)</button>
      </div>
    </div>
  </div>

  <script>
    const SHEET_ID = '1AwmhwA6PCOcQenQOxxktD0TbrqHBY7Glw1E8zUEOxJk';

    const SURVEY_CONFIG = {
      'imds-1st': {
        label: 'IMDS 1회차',
        badge: 'IMDS 1회차 설문',
        subtitle: 'IMDS 실무 현황 및 교육 기대사항 설문 (1회차)',
        sheetName: 'IMDS_1st',
        qrImage: './imds_survey_1st.png',
        formUrl: 'https://docs.google.com/forms/d/e/1FAIpQLSf2BpEtZtqeyJ6b1stVp3X-00xIp-z3KUMkpkJqWVrPDJFWPg/viewform?usp=header'
      },
      'imds-2nd': {
        label: 'IMDS 2회차',
        badge: 'IMDS 2회차 설문',
        subtitle: 'IMDS 교육 만족도 및 후속 과정 수요 설문 (2회차)',
        sheetName: 'IMDS_2nd',
        qrImage: './imds_survey_2nd.png',
        formUrl: 'https://docs.google.com/forms/d/e/1FAIpQLScf3RzwQotPIrHs6tZt9FYG_iE0DvkXmq8obzSewFbHnKXteQ/viewform?usp=header'
      },
      'rmreg-1st': {
        label: '책임광물·규제 1회차',
        badge: '책임광물·제품환경규제 1회차 설문',
        subtitle: '책임광물·제품환경규제 실무 현황 및 교육 기대사항 설문 (1회차)',
        sheetName: 'RMREG_1st',
        qrImage: './rmreg_survey_1st.png',
        formUrl: 'https://docs.google.com/forms/d/e/1FAIpQLSczb4E9fgS4r_g6kDglWdJ0SAN_Kge_LabriU9ixiniIrdEFw/viewform'
      },
      'rmreg-2nd': {
        label: '책임광물·규제 2회차',
        badge: '책임광물·제품환경규제 2회차 설문',
        subtitle: '책임광물·제품환경규제 교육 만족도 및 후속 과정 수요 설문 (2회차)',
        sheetName: 'RMREG_2nd',
        qrImage: './rmreg_survey_2nd.png',
        formUrl: 'https://docs.google.com/forms/d/e/1FAIpQLSe-o7WnafyzpwCQ5TK_S6cRhp0IgZY_WDwjr_2Xa2ENnLvCqA/viewform'
      }
    };

    let currentSession = Object.keys(SURVEY_CONFIG)[0];
    let refreshFeedbackTimer = null;

    function escapeHTML(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function parseCSV(text) {
      const rows = [];
      let row = [], val = '', inQuotes = false;
      for (let i = 0; i < text.length; i++) {
        const ch = text[i], next = text[i + 1];
        if (ch === '"' && inQuotes && next === '"') {
          val += '"';
          i++;
        } else if (ch === '"') {
          inQuotes = !inQuotes;
        } else if (ch === ',' && !inQuotes) {
          row.push(val.trim());
          val = '';
        } else if ((ch === '\n' || (ch === '\r' && next === '\n')) && !inQuotes) {
          if (ch === '\r') i++;
          row.push(val.trim());
          if (row.some(cell => cell !== '')) rows.push(row);
          row = [];
          val = '';
        } else {
          val += ch;
        }
      }
      if (val !== '' || row.length > 0) {
        row.push(val.trim());
        if (row.some(cell => cell !== '')) rows.push(row);
      }
      return rows;
    }

    function setError(message) {
      const banner = document.getElementById('errorBanner');
      if (message) {
        banner.textContent = message;
        banner.classList.add('show');
      } else {
        banner.textContent = '';
        banner.classList.remove('show');
      }
    }

    function renderSessionTabs() {
      const tabsContainer = document.getElementById('sessionTabs');
      tabsContainer.innerHTML = Object.entries(SURVEY_CONFIG).map(([key, cfg]) => `
        <button
          class="tab-btn ${key === currentSession ? 'active' : ''}"
          data-session="${escapeHTML(key)}"
          onclick="switchSession('${escapeHTML(key)}')"
        >${escapeHTML(cfg.label)}</button>
      `).join('');
    }

    function updateHeaderUI() {
      const cfg = SURVEY_CONFIG[currentSession];
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.session === currentSession);
      });
      document.getElementById('sessionTitle').textContent = cfg.subtitle;
      document.getElementById('qrImage').src = cfg.qrImage;
      document.getElementById('modalQrImage').src = cfg.qrImage;
      document.getElementById('modalQrTitle').textContent = `${cfg.badge} 참여 QR 코드`;
      document.getElementById('modalFormLink').href = cfg.formUrl;
    }

    function openQrModal() {
      document.getElementById('qrModal').classList.add('open');
    }

    function closeQrModal() {
      document.getElementById('qrModal').classList.remove('open');
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeQrModal();
    });

    function switchSession(sessionKey) {
      if (currentSession === sessionKey || !SURVEY_CONFIG[sessionKey]) return;
      currentSession = sessionKey;
      setError('');
      updateHeaderUI();
      loadData();
    }

    async function manualRefresh() {
      const btn = document.getElementById('refreshBtn');
      clearTimeout(refreshFeedbackTimer);
      btn.disabled = true;
      btn.classList.remove('btn-success', 'btn-error');
      btn.textContent = '불러오는 중...';

      const ok = await loadData();

      btn.disabled = false;
      if (ok) {
        btn.classList.add('btn-success');
        btn.textContent = '✓ 새로고침 완료';
      } else {
        btn.classList.add('btn-error');
        btn.textContent = '새로고침 실패';
      }

      refreshFeedbackTimer = setTimeout(() => {
        btn.classList.remove('btn-success', 'btn-error');
        btn.textContent = '지금 새로고침';
      }, 1800);
    }

    async function loadData() {
      const requestedSession = currentSession;
      const cfg = SURVEY_CONFIG[requestedSession];
      try {
        const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(cfg.sheetName)}&_=${Date.now()}`;
        const res = await fetch(url);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const csv = await res.text();
        if (requestedSession !== currentSession) return false;

        const rows = parseCSV(csv);
        if (rows.length === 0) {
          setError('시트 헤더를 불러오지 못했습니다. 시트 탭 이름과 데이터를 확인해 주세요.');
          return false;
        }

        setError('');
        renderDashboard(rows[0], rows.slice(1));
        return true;
      } catch (err) {
        if (requestedSession === currentSession) {
          setError('데이터 불러오기 실패 (구글 시트 공유 권한 및 탭 이름을 확인해 주세요)');
        }
        return false;
      }
    }

    function renderBarItem(label, count, total, isTop, totalSelections = 0) {
      const pct = total > 0 ? Math.round((count / total) * 100) : 0;
      const barWidth = Math.min(pct, 100);
      const shareHTML = totalSelections > 0
        ? `<span class="bar-share">(${Math.round((count / totalSelections) * 100)}%)</span>`
        : '';

      return `
        <div class="bar-item ${isTop ? 'is-top' : ''}">
          <div class="bar-meta">
            <span class="bar-label">${escapeHTML(label)}</span>
            <span class="bar-count">
              <span class="bar-num">${count}명</span>
              <strong class="bar-pct">${pct}%</strong>
              ${shareHTML}
            </span>
          </div>
          <div class="bar-track">
            <div class="bar-fill" style="width:${barWidth}%"></div>
          </div>
        </div>
      `;
    }

    function renderDashboard(headers, dataRows) {
      const total = dataRows.length;
      const questions = headers.slice(1);

      document.getElementById('totalParticipants').textContent = `${total}명`;

      let qHTML = '';

      questions.forEach((rawTitle, idx) => {
        const qTitle = rawTitle.trim();
        const colIdx = idx + 1;
        const answers = dataRows.map(r => (r[colIdx] || '').trim()).filter(Boolean);
        const isScale = answers.length > 0 && answers.every(v => ['1', '2', '3', '4', '5'].includes(v));

        const counts = {};
        let totalSelections = 0;

        if (isScale) {
          ['5', '4', '3', '2', '1'].forEach(score => { counts[score + '점'] = 0; });
          answers.forEach(v => {
            counts[v + '점']++;
            totalSelections++;
          });
        } else {
          answers.forEach(v => {
            v.split(',').map(s => s.trim()).filter(Boolean).forEach(option => {
              counts[option] = (counts[option] || 0) + 1;
              totalSelections++;
            });
          });
        }

        const isMultiSelect = !isScale && answers.length > 0 && totalSelections > answers.length;

        const sortedEntries = Object.entries(counts).sort(
          (a, b) => b[1] - a[1] || a[0].localeCompare(b[0], 'ko', { numeric: true })
        );
        const displayEntries = isScale ? Object.entries(counts) : sortedEntries;
        const maxCount = displayEntries.reduce((max, [, c]) => Math.max(max, c), 0);

        const hasDiffCount = answers.length > 0 && answers.length !== total;
        const metaHTML = hasDiffCount ? `<span class="q-meta">응답 ${answers.length}명</span>` : '';

        let leftFooterHTML = '';
        if (isScale && answers.length > 0) {
          const avgDisplay = (answers.reduce((sum, v) => sum + Number(v), 0) / answers.length).toFixed(2);
          leftFooterHTML = `
            <div class="scale-kpi">
              <span class="scale-kpi-label">평균 점수</span>
              <strong class="scale-kpi-val">${avgDisplay}</strong>
              <span class="scale-kpi-max">/ 5.0</span>
            </div>
          `;
        } else if (isMultiSelect) {
          const avgChoices = (totalSelections / answers.length).toFixed(1);
          leftFooterHTML = `
            <div class="multi-note">
              복수 응답 · <strong>총 ${totalSelections}건</strong> (1인당 평균 <strong>${avgChoices}개</strong>)
              <span class="multi-note-sub">괄호(%)는 전체 선택 건수 대비 비중</span>
            </div>
          `;
        }

        let rightHTML = '';
        if (displayEntries.length === 0) {
          rightHTML = `<p class="empty-note">아직 수집된 응답이 없습니다.</p>`;
        } else if (isScale) {
          const topEntries = displayEntries.filter(([, count]) => maxCount > 0 && count === maxCount);
          const topBarsHTML = topEntries
            .map(([label, count]) => renderBarItem(label, count, total, true, 0))
            .join('');

          const summaryHTML = displayEntries
            .map(([label, count]) => {
              const isTop = maxCount > 0 && count === maxCount;
              return `<span class="scale-chip ${isTop ? 'is-top' : ''}">${escapeHTML(label)} <strong>${count}명</strong></span>`;
            })
            .join('<span class="scale-sep">·</span>');

          rightHTML = `
            <div class="bar-list">${topBarsHTML}</div>
            <div class="scale-summary">${summaryHTML}</div>
          `;
        } else {
          const barsHTML = displayEntries
            .map(([label, count]) => renderBarItem(
              label,
              count,
              total,
              maxCount > 0 && count === maxCount,
              isMultiSelect ? totalSelections : 0
            ))
            .join('');
          rightHTML = `<div class="bar-list">${barsHTML}</div>`;
        }

        qHTML += `
          <article class="q-card">
            <div class="q-left">
              <div>
                <div class="q-left-top">
                  <span class="q-num">Q${idx + 1}</span>
                  ${metaHTML}
                </div>
                <h2 class="q-title">${escapeHTML(qTitle)}</h2>
              </div>
              ${leftFooterHTML}
            </div>
            <div class="q-right">
              ${rightHTML}
            </div>
          </article>
        `;
      });

      document.getElementById('qGrid').innerHTML = qHTML;
    }

    renderSessionTabs();
    updateHeaderUI();
    loadData();
    setInterval(() => loadData(), 10000);
  </script>
</body>
</html>
